version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - audit-data:/data
    environment:
      - DATABASE_URL=sqlite:////data/audit.db
      - CORS_ORIGINS=*
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m streamlit run /app/frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  audit-data:
