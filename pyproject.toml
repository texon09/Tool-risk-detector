[project]
name = "agent-risk-detector"
version = "0.1.0"
description = "AI Agent Tool-Call Risk Detector"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "node_modules",
    "frontend",
    "scratch",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501", # line-too-long (handled by formatter)
    "E402", # module level import not at top of file (sys.path manipulation)
]
