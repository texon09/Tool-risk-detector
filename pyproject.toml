[project]
name = "agent-risk-detector"
version = "0.1.0"
description = "AI Agent Tool-Call Risk Detector"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","B"]
