name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - backend-and-security
      - feature/model-training
  pull_request:
    branches:
      - main
      - backend-and-security

jobs:
  test:
    name: Lint & Test Suite with Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Code Formatting & Lint Check
        run: |
          python -m ruff check .

      - name: Validate Dataset
        run: |
          python -m backend.training.validate_dataset --data-dir data/processed

      - name: Run Pytest with Coverage
        run: |
          python -m pytest --cov=backend --cov-report=term-missing --cov-fail-under=70 -v

  docker:
    name: Build Docker Container
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agent-risk-detector:latest
